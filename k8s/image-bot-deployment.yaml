apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-bot-1
  namespace: telegram-bots
  labels:
    app.kubernetes.io/name: image-bot-1
    app.kubernetes.io/component: bot-instance
    app.kubernetes.io/part-of: telegram-bots
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: image-bot-1
  template:
    metadata:
      labels:
        app: image-bot-1
        app.kubernetes.io/name: image-bot-1
        app.kubernetes.io/component: bot-instance
    spec:
      containers:
        - name: image-bot
          image: telegram-bots-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "platform_core.cli", "start", "image_bot_1"]
          envFrom:
            - configMapRef:
                name: telegram-bots-config
            - secretRef:
                name: telegram-bots-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
