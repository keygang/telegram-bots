apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-server
  namespace: telegram-bots
  labels:
    app.kubernetes.io/name: webhook-server
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: telegram-bots
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-server
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: webhook-server
        app.kubernetes.io/name: webhook-server
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: webhook-server
          image: telegram-bots-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "platform_core.cli", "server", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: telegram-bots-config
            - secretRef:
                name: telegram-bots-secret
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-server
  namespace: telegram-bots
  labels:
    app.kubernetes.io/name: webhook-server
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: telegram-bots
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: webhook-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook-server-ingress
  namespace: telegram-bots
  labels:
    app.kubernetes.io/name: webhook-server
    app.kubernetes.io/component: gateway
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: bot-gateway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webhook-server
                port:
                  number: 8000
