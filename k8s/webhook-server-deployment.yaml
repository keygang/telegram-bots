apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-server
  namespace: telegram-bots
  labels:
    app.kubernetes.io/name: webhook-server
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: telegram-bots
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webhook-server
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: webhook-server
        app.kubernetes.io/name: webhook-server
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: webhook-server
          image: telegram-bots-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "platform_core.cli", "server", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: telegram-bots-config
            - secretRef:
                name: telegram-bots-secret
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-server
  namespace: telegram-bots
  labels:
    app.kubernetes.io/name: webhook-server
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: telegram-bots
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: webhook-server
