    app.kubernetes.io/name: telegram-bots-platform
type: Opaque
stringData:
  IMAGE_BOT_TOKEN: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz_image"
  OPENROUTER_API_KEY: "sk-or-v1-your_openrouter_api_key_here"
