version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: telegram_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  webhook_server:
    build: .
    container_name: telegram_webhook_server
    restart: unless-stopped
    command: python -m platform_core.cli server --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_FORMAT=json
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai_worker:
    build: .
    container_name: telegram_ai_worker
    restart: unless-stopped
    command: python -m platform_core.cli worker --concurrency 4
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_FORMAT=json
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"

  all_bots:
    build: .
    container_name: telegram_all_bots
    restart: unless-stopped
    profiles:
      - all
    command: python -m platform_core.cli start all
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_FORMAT=json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  image_bot_1:
    build: .
    container_name: telegram_image_bot_1
    restart: unless-stopped
    command: python -m platform_core.cli start image_bot_1
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_FORMAT=json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin_bot:
    build: .
    container_name: telegram_admin_bot
    restart: unless-stopped
    command: python -m platform_core.cli start admin_bot
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_FORMAT=json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: telegram_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:2.9.4
    container_name: telegram_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
    command: -config.file=/etc/loki/loki-config.yml

  promtail:
    image: grafana/promtail:2.9.4
    container_name: telegram_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml

  grafana:
    image: grafana/grafana:10.3.3
    container_name: telegram_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki

