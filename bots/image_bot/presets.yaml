    category: "artistic"
    media_type: "image"
    prompt_template: "Masterpiece oil painting depicting {user_prompt}, rich textures, dramatic chiaroscuro lighting, Renaissance style"
    negative_prompt: "digital photo, 3d render, modern, low quality"
    default_model: "openrouter/black-forest-labs/flux-1-schnell"
    supports_reference_photo: true

  - id: "cinematic_anime"
    title: "Ghibli Cinematic Anime"
    description: "Lush Studio Ghibli style watercolor anime aesthetic"
