[project]
name = "telegram-bots-platform"
version = "0.1.0"
description = "Extensible Telegram AI Bot Platform with uv, aiogram 3, Supabase, LiteLLM / Unified Media Generator, and Telegram Stars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "litellm>=1.30.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bot-cli = "platform_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["platform_core", "bots"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
