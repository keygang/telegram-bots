[project]
name = "telegram-bots-platform"
version = "0.1.0"
description = "Extensible Telegram AI Bot Platform with uv, aiogram 3, Supabase, LiteLLM / Unified Media Generator, and Telegram Stars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "litellm>=1.30.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bot-cli = "platform_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["platform_core", "bots"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # type-checking imports
    "PERF",   # perflint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length violations (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "RUF012", # mutable class attributes in Pydantic / dataclasses
    "RUF001", # ambiguous unicode characters (common in Telegram bot UI text / emojis)
    "RUF002", # ambiguous docstring characters
    "RUF003", # ambiguous comment characters
]

[tool.ruff.lint.isort]
known-first-party = ["platform_core", "bots"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

