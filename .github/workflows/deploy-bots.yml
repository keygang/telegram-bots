name: Deploy Telegram Bots 🤖

on:
  push:
    branches: [main]
    paths:
      - 'bots/**'
      - 'platform_core/**'
      - 'instances/**'
      - 'k8s/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker-compose.yml'
      - 'docker-compose.dokploy.yml'
      - '.github/workflows/deploy-bots.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev
      bot_instance:
        description: 'Target Service/Bot (e.g. "all", "image_bot_1", "admin_bot", "webhook_server", "ai_worker")'
        required: true
        default: 'all'
        type: string
      deploy_strategy:
        description: 'Deployment Strategy'
        required: true
        default: 'k8s-remote'
        type: choice
        options:
          - k8s-remote
          - dokploy-webhook
          - ssh-remote-docker-compose
          - docker-compose-ci
          - dry-run-test

jobs:
  validate-and-test:
    name: 🧪 Validate Code, Configs & K8s Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          uv run pytest

      - name: Validate Bot Instance YAML Configurations
        run: |
          uv run python -m platform_core.cli list

      - name: Validate Kubernetes Manifests (Kustomize)
        run: |
          kubectl kustomize k8s/ > /dev/null
          echo "✅ Kubernetes manifests successfully validated."

  deploy:
    name: 🚀 Deploy Bot Services (${{ inputs.bot_instance || 'all' }})
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ inputs.deploy_strategy != 'dry-run-test' }}
        uses: docker/setup-buildx-action@v3

      # --- Strategy: Dry Run Test ---
      - name: Dry Run Test Verification
        if: ${{ inputs.deploy_strategy == 'dry-run-test' }}
        run: |
          echo "✅ Dry Run Bot Deployment Validation Complete."
          echo "Target Environment: ${{ inputs.environment }}"
          echo "Target Service: ${{ inputs.bot_instance }}"

      # --- Strategy: Docker Compose Local/CI Build ---
      - name: Build & Test Docker Image
        if: ${{ inputs.deploy_strategy == 'docker-compose-ci' }}
        run: |
          echo "🐳 Building Docker image for commit ${{ github.sha }}..."
          docker build -t telegram-bots-platform:${{ github.sha }} .

          echo "🔍 Validating container execution with instance list..."
          docker run --rm telegram-bots-platform:${{ github.sha }} python -m platform_core.cli list

          echo "🚀 Validating docker-compose.yml config..."
          docker compose config

      # --- Strategy: Dokploy Webhook Trigger ---
      - name: Trigger Dokploy Webhook API
        if: ${{ inputs.deploy_strategy == 'dokploy-webhook' }}
        run: |
          echo "📡 Triggering Dokploy deployment webhook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response: $BODY"
          echo "HTTP Status Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "🎉 Dokploy deployment successfully triggered!"
          else
            echo "❌ Failed to trigger Dokploy deployment (HTTP $HTTP_CODE)"
            exit 1
          fi

      # --- Strategy: Kubernetes (k3s) Remote Deployment ---
      - name: Deploy to Kubernetes Cluster (k3s)
        if: ${{ inputs.deploy_strategy == 'k8s-remote' || inputs.deploy_strategy == '' || github.event_name == 'push' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/telegram-bots || exit 1
            git pull origin main

            TARGET="${{ inputs.bot_instance || 'all' }}"
            echo "Deploying bot service target to Kubernetes (k3s): $TARGET"

            # Execute deploy script
            chmod +x scripts/deploy_k8s.sh
            ./scripts/deploy_k8s.sh "$TARGET"

      # --- Strategy: Legacy Docker Compose SSH Remote Deployment ---
      - name: Legacy Docker Compose Remote Deploy
        if: ${{ inputs.deploy_strategy == 'ssh-remote-docker-compose' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/telegram-bots || exit 1
            git pull origin main

            # Ensure shared Docker bridge network exists
            docker network create telegram_net 2>/dev/null || true

            TARGET="${{ inputs.bot_instance || 'all' }}"
            echo "Deploying bot service target (Docker Compose): $TARGET"

            if [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
              docker compose up -d --build --remove-orphans
            else
              docker compose up -d --build --no-deps $TARGET
            fi

            docker compose ps
