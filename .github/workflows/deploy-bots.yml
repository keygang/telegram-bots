name: Deploy Telegram Bots 🤖

on:
  push:
    branches: [main]
    paths:
      - 'bots/**'
      - 'platform_core/**'
      - 'instances/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-bots.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev
      bot_instance:
        description: 'Target Service/Bot (e.g. "all", "image_bot_1", "admin_bot", "webhook_server", "ai_worker")'
        required: true
        default: 'all'
        type: string
      deploy_strategy:
        description: 'Deployment Strategy'
        required: true
        default: 'ssh-remote'
        type: choice
        options:
          - ssh-remote
          - docker-compose
          - dry-run-test

jobs:
  validate-and-test:
    name: 🧪 Validate Code & Instance Configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          uv run pytest

      - name: Validate Bot Instance YAML Configurations
        run: |
          uv run python -m platform_core.cli list

  deploy:
    name: 🚀 Deploy Bot Services (${{ inputs.bot_instance || 'all' }})
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ inputs.deploy_strategy != 'dry-run-test' }}
        uses: docker/setup-buildx-action@v3

      # --- Strategy: Dry Run Test ---
      - name: Dry Run Test Verification
        if: ${{ inputs.deploy_strategy == 'dry-run-test' }}
        run: |
          echo "✅ Dry Run Bot Deployment Validation Complete."
          echo "Target Environment: ${{ inputs.environment }}"
          echo "Target Service: ${{ inputs.bot_instance }}"

      # --- Strategy: Docker Compose Local/CI Build ---
      - name: Build & Test Docker Image
        if: ${{ inputs.deploy_strategy == 'docker-compose' }}
        run: |
          echo "🐳 Building Docker image for commit ${{ github.sha }}..."
          docker build -t telegram-bots-platform:${{ github.sha }} .

          echo "🔍 Validating container execution with instance list..."
          docker run --rm telegram-bots-platform:${{ github.sha }} python -m platform_core.cli list

          echo "🚀 Validating docker-compose.yml config..."
          docker compose config

      # --- Strategy: SSH Remote Deployment ---
      - name: SSH Remote Deploy to Server
        if: ${{ inputs.deploy_strategy == 'ssh-remote' || inputs.deploy_strategy == '' || github.event_name == 'push' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/telegram-bots || exit 1
            git pull origin main

            # Ensure shared Docker bridge network exists
            docker network create telegram_net 2>/dev/null || true

            TARGET="${{ inputs.bot_instance || 'all' }}"
            echo "Deploying bot service target: $TARGET"

            if [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
              docker compose up -d --build --remove-orphans
            else
              docker compose up -d --build --no-deps $TARGET
            fi

            docker compose ps
