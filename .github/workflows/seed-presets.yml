name: Seed Prompt Presets 🎨

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev
      presets_file:
        description: 'Presets File Path'
        required: true
        default: 'bots/image_bot/presets.yaml'
        type: string
      deploy_strategy:
        description: 'Execution Strategy'
        required: true
        default: 'ssh-remote'
        type: choice
        options:
          - ssh-remote
          - direct-runner
          - dry-run-test

jobs:
  validate:
    name: 🔍 Validate Presets File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Presets File Exists
        run: |
          test -s "${{ inputs.presets_file }}" || (echo "❌ Presets file ${{ inputs.presets_file }} is missing or empty" && exit 1)
          echo "✅ Presets file ${{ inputs.presets_file }} is valid."

  seed:
    name: 🎨 Seed Presets (${{ inputs.environment }})
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Strategy: Dry Run Test ---
      - name: Dry Run Test
        if: ${{ inputs.deploy_strategy == 'dry-run-test' }}
        run: |
          echo "✅ Dry run successful for seeding presets."
          echo "Environment: ${{ inputs.environment }}"
          echo "Presets File: ${{ inputs.presets_file }}"

      # --- Strategy: Direct Runner (using repository secrets) ---
      - name: Direct Runner Seeding via Supabase API
        if: ${{ inputs.deploy_strategy == 'direct-runner' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen
          uv run python scripts/seed_presets.py --file "${{ inputs.presets_file }}"

      # --- Strategy: SSH Remote Host Execution ---
      - name: SSH Remote Seeding Execution
        if: ${{ inputs.deploy_strategy == 'ssh-remote' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/telegram-bots || exit 1
            git pull origin main

            echo "Executing presets seeding on server..."
            if command -v uv &> /dev/null; then
              uv run python scripts/seed_presets.py --file "${{ inputs.presets_file }}"
            else
              python3 scripts/seed_presets.py --file "${{ inputs.presets_file }}"
            fi
            echo "🎉 Seeding complete!"
