name: CI Pipeline 🧪

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🐍 Test & Validate (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          uv run pytest -v

      - name: Validate Instance YAML Configurations
        run: |
          uv run python -m platform_core.cli list

  docker-check:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: telegram-bots-platform:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container CLI Execution
        run: |
          docker run --rm telegram-bots-platform:ci-test python -m platform_core.cli list
